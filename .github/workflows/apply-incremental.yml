name: Apply Incremental Package & Build APK

# 增量包部署 + 构建工作流（unzip-and-overwrite → build APK）。
#
# 重要：本工作流文件本身需要手动提交到仓库一次（通过 GitHub Web UI 或本地 git push 均可，
#       因为你自己的账号有 workflows 写权限）。之后它就会被自动触发，无需再手动改它。
#       增量包（.zip）里只放「源码改动」，不要包含 .github/workflows 下的文件，
#       这样 GITHUB_TOKEN 用 contents: write 即可完成推送，避免 workflows 权限报错。
#
# 用法（二选一）：
#   A. 把增量包（如 incremental/agora-local-model-control.zip）提交到 master 的 incremental/ 目录，
#      推送即自动触发（push 事件匹配 incremental/**.zip）。
#   B. 在 Actions 页面手动 Run workflow，可指定包路径。
#
# 流程：检出 → 解压覆盖 → 提交源码改动([skip ci]) → 配置 JDK/Android SDK → Gradle 构建 APK → 上传产物。

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Path (relative to repo root) to the incremental .zip package"
        required: false
        default: "incremental/agora-local-model-control.zip"
  push:
    branches: [master]
    paths:
      - "incremental/**.zip"

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve package path
        id: pkg
        run: |
          PKG="${{ github.event.inputs.package }}"
          if [ -z "$PKG" ]; then PKG="incremental/agora-local-model-control.zip"; fi
          echo "path=$PKG" >> "$GITHUB_OUTPUT"
          if [ ! -f "$PKG" ]; then
            echo "::error::Incremental package not found: $PKG"
            exit 1
          fi

      - name: Inspect package contents
        run: |
          echo "Package: ${{ steps.pkg.outputs.path }}"
          unzip -l "${{ steps.pkg.outputs.path }}"

      - name: Unzip and overwrite
        run: |
          # 用归档里的仓库相对路径，覆盖式写入仓库对应文件。
          unzip -o "${{ steps.pkg.outputs.path }}" -d .

      - name: Commit applied source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # 不要把增量包 .zip 本身再提交进仓库
          git reset -q -- "incremental/*.zip" "*.zip" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No source changes to apply."
          else
            git commit -m "chore: apply incremental package (local model load/unload + status) [skip ci]"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
