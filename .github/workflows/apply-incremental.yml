name: Apply Incremental Package & Build APK

on:
  push:
    branches: [master]
    paths:
      - 'incremental/**.zip'
  workflow_dispatch:
    inputs:
      package:
        description: 'Path to the incremental package zip (repo-relative)'
        required: false
        default: 'incremental/agora-local-model-control.zip'

permissions:
  contents: write

concurrency:
  group: apply-incremental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Xmx2g -XX:MaxMetaspaceSize=512m
    steps:
      - name: Set up job
        run: echo "Starting incremental apply & build"

      # ── 关键修复：必须递归拉取 git 子模块，否则 thirdparty/llama.cpp 为空，
      #    CMake 的 add_subdirectory 会因找不到 CMakeLists.txt 而失败。 ──
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: alenol/Agora
          submodules: recursive        # ← false 改为 recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve package path
        id: pkg
        run: |
          PKG="${{ github.event.inputs.package }}"
          if [ -z "$PKG" ]; then PKG="incremental/agora-local-model-control.zip"; fi
          echo "path=$PKG" >> "$GITHUB_OUTPUT"
          if [ ! -f "$PKG" ]; then
            echo "::error::Incremental package not found: $PKG"
            exit 1
          fi

      - name: Inspect package contents
        run: |
          echo "Package: ${{ steps.pkg.outputs.path }}"
          unzip -l "${{ steps.pkg.outputs.path }}"

      - name: Unzip and overwrite
        run: unzip -o "${{ steps.pkg.outputs.path }}" -d .

      - name: Commit applied source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # 不要把增量包 .zip 本身再提交进仓库
          git reset -q -- "incremental/*.zip" "*.zip" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No source changes to apply."
          else
            git commit -m "chore: apply incremental package (local model load/unload + status) [skip ci]"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # NDK 28.2.13676358 与 CMake 3.22.1 在 GitHub  runners 上已预装 / 由 AGP 自动下载，
      # 无需额外安装步骤（与仓库官方 build.yml 行为一致）。
      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "tools" "platform-tools"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
