name: Debug (with logs) + llama.cpp bump

# 诊断专用构建：与 build.yml 同构，产出未签名的 fdroidDebug APK。
# Debug 构建默认可调试（FLAG_DEBUGGABLE），DebugLog 自动开启，
# 因此「设置 ▸ 日志查看」里能看到本地模型加载/生成的诊断日志，便于排查 failed to load 等问题。
#
# 子模块升级（方案 2 / CI 强制覆盖）：
# 在 checkout 之后强制把 thirdparty/llama.cpp 切到支持 qwen35 SSM 的目标 commit，
# 无需手动提交 fork 子模块指针。增量包（含新版 JNI 移植）照常上传即可。

on:
  push:
    branches: [master]
    paths:
      - 'incremental/**.zip'
  workflow_dispatch:
    inputs:
      package:
        description: 'Path to the incremental package zip (repo-relative)'
        required: false
        default: 'incremental/agora-local-model-control.zip'

permissions:
  contents: read

concurrency:
  group: debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # 递归拉取子模块：thirdparty/llama.cpp 必须存在，否则 CMake add_subdirectory 失败。
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 方案 2：CI 强制把 llama.cpp 切到支持 qwen35 SSM 混合架构的版本。
      - name: Bump llama.cpp for qwen35 SSM support
        run: |
          cd thirdparty/llama.cpp
          git fetch origin ca3d5a3e10d53f7ea672cb9b6178faca3e2807bc
          git checkout ca3d5a3e10d53f7ea672cb9b6178faca3e2807bc
          cd ../..

      # 增量交付：解压覆盖（在 checkout / bump 之后、构建之前）。
      - name: Unzip and overwrite (apply incremental package)
        run: |
          PKG="${{ github.event.inputs.package }}"
          if [ -z "$PKG" ]; then PKG="incremental/agora-local-model-control.zip"; fi
          if [ ! -f "$PKG" ]; then
            echo "::error::Incremental package not found: $PKG"
            exit 1
          fi
          echo "Applying incremental package: $PKG"
          unzip -o "$PKG" -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 官方动作装好 SDK/NDK 28.2（CMake 由 AGP 自动下载），避免裸调 sdkmanager 找不到命令。
      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v4

      # 提速：去掉 PRoot 运行时构建与签名，直接出未签名的 fdroidDebug APK。
      - name: Build F-Droid Debug APK (with logs)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFdroidDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agora-fdroid-debug-logs
          path: app/build/outputs/apk/fdroid/debug/*.apk
